<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ToDo Timeline</title>
<meta name="description" content="Список задач на неделю: создавайте, отмечайте и удаляйте задачи, всё сохраняется в браузере">
<meta name="theme-color" content="#3F63E9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233F63E9'/%3E%3Cpath d='M10 22v-5M16 22V10M22 22v-8' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
@font-face{font-family:Manrope;src:url(assets/manrope-cyrillic-500.woff2) format("woff2");font-weight:500;font-display:swap;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Manrope;src:url(assets/manrope-latin-500.woff2) format("woff2");font-weight:500;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Manrope;src:url(assets/manrope-cyrillic-600.woff2) format("woff2");font-weight:600;font-display:swap;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Manrope;src:url(assets/manrope-latin-600.woff2) format("woff2");font-weight:600;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Manrope;src:url(assets/manrope-cyrillic-700.woff2) format("woff2");font-weight:700;font-display:swap;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Manrope;src:url(assets/manrope-latin-700.woff2) format("woff2");font-weight:700;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Manrope;src:url(assets/manrope-cyrillic-800.woff2) format("woff2");font-weight:800;font-display:swap;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Manrope;src:url(assets/manrope-latin-800.woff2) format("woff2");font-weight:800;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --blue:#3F63E9;--blue-2:#3556D6;--blue-3:#2F4DC4;--wave:#5B7CF4;--blue-soft:#E8EDFD;
  --card:#F0F1F7;--line:#DADDE7;--line-2:#E3E5EC;--ink:#24262E;--mute:#8C8F9B;--soft:#B5B8C4;
  --c-work:#5B4CF5;--c-personal:#F2762E;--c-study:#B04FC6;--c-done:#C4C6CF;
  --hour:96px;--hcol:52px;--colmin:156px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--blue);color:var(--ink);font:500 14px/1.4 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
svg{display:block;width:1em;height:1em;flex:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.bgw{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.bgw:before{content:"";position:absolute;width:150vmax;height:150vmax;border-radius:50%;background:var(--wave);left:42%;top:-118vmax}
.bgw:after{content:"";position:absolute;width:70vmax;height:70vmax;border-radius:50%;background:var(--wave);right:-52vmax;bottom:-40vmax}

/* каркас: рабочая область в 48 px от краёв экрана */
.page{position:relative;min-height:100vh;min-height:100dvh;padding:48px}
.shell{width:100%;height:max(calc(100vh - 96px),800px);height:max(calc(100dvh - 96px),800px);background:var(--card);border-radius:40px;
  display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:32px;padding:16px 16px 16px 40px;animation:rise .7s var(--ease) backwards}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.985)}}
.left{display:flex;flex-direction:column;min-width:0;min-height:0;padding:24px 0}

/* шапка */
.head{display:flex;align-items:center;gap:20px;margin-bottom:32px}
.logo{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--ink)}
.logo svg{font-size:22px;color:var(--blue)}
.logo b{font-weight:800}
.head__sp{flex:1}
.hicons{display:flex;gap:8px}
.hbtn{position:relative;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:#9497a3;transition:background .2s,color .2s}
.hbtn:hover{background:#e6e8f0;color:#5c5f6b}
.hbtn.act{color:var(--ink);background:#fff}
.hbtn i{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:#F0465B;border:1.5px solid var(--card);display:none}
.hbtn.dot i{display:block}
.who{display:flex;align-items:center;gap:14px;margin-left:16px;font-size:13px;font-weight:600;color:var(--ink)}
.who__ring{position:relative;width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center}
.who__ring svg{position:absolute;inset:3px;width:46px;height:46px}
.who__ring span{font-size:12px;font-weight:800;letter-spacing:-.02em}

/* таймлайн */
.view{position:relative;flex:1;min-height:0}
.tl{position:absolute;inset:0;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);overscroll-behavior:contain;scroll-snap-type:x proximity;scroll-padding-left:var(--hcol)}
.tl__head,.tl__body{display:grid;grid-template-columns:var(--hcol) repeat(7,minmax(var(--colmin),1fr));min-width:min-content}
.tl__head{position:sticky;top:0;z-index:5;background:var(--card)}
.tl__corner{position:sticky;left:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);border-right:1px solid var(--line);display:grid;place-items:center;color:#7d808c;font-size:14px}
.tl__corner:hover{color:var(--blue)}
.tl__day{height:56px;display:flex;align-items:center;justify-content:center;gap:6px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);font-size:14px;font-weight:600;color:#8a8d99;scroll-snap-align:start;transition:color .2s,background .2s}
.tl__day:last-child{border-right:0}
.tl__day:hover{background:#e9ebf2}
.tl__day b{font-weight:800}
.tl__day.today{color:var(--ink)}
.tl__day.today b{color:var(--blue)}
.tl__day.sel{background:#fff;color:var(--ink)}
.tl__day.drop{background:var(--blue-soft);color:var(--blue)}
.tl__body{position:relative;min-height:calc(var(--hour)*24)}
.tl__hours{position:sticky;left:0;z-index:4;background:var(--card);border-right:1px solid var(--line)}
.tl__hours span{position:absolute;left:0;right:0;text-align:center;transform:translateY(-50%);font-size:13px;font-weight:600;color:#6f727e}
.tl__col{position:relative;border-right:1px solid var(--line);cursor:copy}
.tl__col:last-child{border-right:0}
.tl__lines{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,transparent calc(100% - 1px),var(--line) calc(100% - 1px)) 0 0/100% var(--hour)}
.tl__col.sel{background:rgba(255,255,255,.45)}
.now{position:absolute;left:0;right:0;height:2px;background:var(--c-work);z-index:3;pointer-events:none}
.now:before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--c-work)}

.task{position:absolute;background:#fff;border:1px solid transparent;border-radius:8px;padding:11px 9px 7px 13px;cursor:pointer;display:flex;flex-direction:column;z-index:2;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:border-color .2s,transform .25s var(--ease),opacity .3s}
.task:hover{border-color:#CBD1E2;transform:translateY(-1px);z-index:4}
.task.editing{outline:2px solid var(--blue);outline-offset:-1px}
.bar{width:16px;height:3px;border-radius:2px;flex:none;transition:background .3s}
.work .bar{background:var(--c-work)}.personal .bar{background:var(--c-personal)}.study .bar{background:var(--c-study)}
.done .bar{background:var(--c-done)}
.task__t{flex:none;margin-top:8px;font-size:13px;font-weight:700;line-height:1.3;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:break-word;hyphens:auto}
.task__b{margin-top:auto;display:flex;align-items:center;gap:2px}
.task__m{flex:1;min-width:0;font-size:11px;font-weight:600;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.done .task__t{color:#a5a7b1;text-decoration:line-through}
.task.done{background:#F8F8FB}
.chk{width:20px;height:20px;border-radius:50%;border:1.6px solid #c9cbd4;display:grid;place-items:center;font-size:12px;color:transparent;transition:all .2s;flex:none}
.chk:hover{border-color:var(--blue);color:rgba(63,99,233,.4)}
.done .chk{background:var(--blue);border-color:var(--blue);color:#fff}
.chk svg path{stroke-dasharray:24}
.chk.pop svg path{animation:draw .35s var(--ease)}
@keyframes draw{from{stroke-dashoffset:24}}
.del{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:14px;color:#a5a7b1;opacity:0;transition:opacity .2s,color .2s,background .2s}
.task:hover .del,.lrow:hover .del{opacity:1}
.del:hover{color:#E0485C;background:#fdeef0}
.task.enter,.lrow.enter{animation:enter .5s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(10px) scale(.94)}}
.task.leave,.lrow.leave{animation:leave .25s ease-in both;pointer-events:none}
@keyframes leave{to{opacity:0;transform:scale(.92)}}
.task.dim,.lrow.dim{opacity:.18}
.flash{animation:flash 1.4s var(--ease)}
@keyframes flash{0%,40%,80%{outline:2px solid var(--blue);outline-offset:2px}20%,60%,100%{outline:2px solid transparent;outline-offset:6px}}
.ghost{position:absolute;left:8px;right:8px;border-radius:8px;border:1.5px dashed var(--blue);background:rgba(63,99,233,.06);pointer-events:none;display:none;z-index:1}
.swap{animation:swap .45s var(--ease) both}
@keyframes swap{from{opacity:0;transform:translateY(8px)}}

/* перетаскивание */
.drag-src{opacity:.3!important;transform:none!important}
.drag-clone{position:fixed!important;left:0!important;top:0!important;margin:0;z-index:80;pointer-events:none;transition:none!important;animation:none!important;border-color:var(--blue)!important;opacity:.97}
.drag-clone .del{display:none}
.dropghost{position:absolute;left:8px;right:8px;border-radius:8px;border:1.5px dashed var(--blue);background:rgba(63,99,233,.08);pointer-events:none;z-index:1;padding:10px 13px;font-size:12px;font-weight:800;color:var(--blue);transition:top .12s var(--ease)}
body.dragging,body.dragging *{cursor:grabbing!important;-webkit-user-select:none;user-select:none}

/* список */
.list{position:absolute;inset:0;overflow:auto;padding-right:8px}
.lgroup{margin-bottom:26px}
.lgroup h3{display:flex;align-items:baseline;gap:10px;font-size:15px;font-weight:700;margin-bottom:10px;color:var(--ink)}
.lgroup h3 small{font-size:12px;font-weight:600;color:var(--mute)}
.lgroup.today h3{color:var(--blue)}
.lrow{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid transparent;border-radius:10px;padding:12px 12px 12px 16px;margin-bottom:8px;cursor:pointer;transition:border-color .2s,opacity .3s}
.lrow:hover{border-color:#CBD1E2}
.lrow.editing{outline:2px solid var(--blue);outline-offset:-1px}
.lrow .bar{width:3px;height:30px;align-self:center}
.lrow__main{flex:1;min-width:0}
.lrow__t{display:block;font-size:14px;font-weight:700;overflow-wrap:break-word}
.lrow__d{font-size:12px;font-weight:600;color:var(--mute);margin-top:2px;white-space:pre-line;overflow-wrap:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lrow__m{font-size:12px;font-weight:600;color:var(--mute);white-space:nowrap}
.lrow.done .lrow__t{color:#a5a7b1;text-decoration:line-through}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mute);font-size:14px;padding:20px}
.empty b{display:block;color:var(--ink);font-size:16px;font-weight:700;margin-bottom:6px}

/* правая панель: 40 − 16 = 24, 24 − 12 = 12 */
.side{background:var(--blue);border-radius:24px;padding:12px;display:flex;flex-direction:column;min-height:0;color:#fff}
.search{position:relative;height:48px;border-radius:1000px;background:var(--blue-3);display:flex;align-items:center;gap:12px;padding:0 18px;flex:none}
.search>svg{font-size:18px;opacity:.95}
.search input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;font-size:14px;font-weight:600;color:#fff}
.search input::placeholder{color:rgba(255,255,255,.85)}
.search .qx{width:28px;height:28px;border-radius:50%;display:none;place-items:center;font-size:15px;margin-right:-8px}
.search .qx:hover{background:rgba(255,255,255,.14)}
.search.has .qx{display:grid}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:20;background:#fff;border-radius:12px;padding:6px;color:var(--ink);max-height:360px;overflow-y:auto;overscroll-behavior:contain;
  opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .18s,transform .25s var(--ease),visibility .25s}
.sugg.open{opacity:1;visibility:visible;transform:none}
.sg{display:flex;align-items:center;gap:12px;width:100%;padding:10px 10px 10px 12px;border-radius:8px;text-align:left;transition:background .15s}
.sg:hover,.sg.act{background:var(--blue-soft)}
.sg .bar{width:3px;height:30px}
.sg__main{flex:1;min-width:0}
.sg__t{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg__m{display:block;font-size:11px;font-weight:600;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg mark{background:none;color:var(--blue)}
.sg.done .sg__t{color:#a5a7b1;text-decoration:line-through}
.sugg__empty{padding:14px 12px;font-size:13px;font-weight:600;color:var(--mute)}
.cal{padding:20px 14px 8px;flex:none}
.cal__head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal__title{font-size:17px;font-weight:700;color:#fff;border-radius:8px;padding:2px 6px;margin-left:-6px}
.cal__title:hover{background:rgba(255,255,255,.1)}
.cal__nav{display:flex;gap:6px}
.cal__nav button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:#fff;transition:background .2s}
.cal__nav button:hover{background:rgba(255,255,255,.12)}
.cal__grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;text-align:center}
.cal__wd{font-size:12px;font-weight:600;color:#fff;padding-bottom:8px}
.cal__d{height:36px;width:36px;margin:0 auto;border-radius:50%;border:1.5px solid transparent;display:grid;place-items:center;font-size:14px;font-weight:700;color:#fff;transition:background .2s,color .2s}
.cal__d:hover{background:rgba(255,255,255,.12)}
.cal__d.out{color:rgba(255,255,255,.32)}
.cal__d.today{border-color:rgba(255,255,255,.6)}
.cal__d.sel{background:#fff;color:var(--blue);border-color:#fff}

.form-slot{margin-top:auto;position:relative;flex:none}
.form{position:absolute;left:0;right:0;bottom:0;z-index:8;background:#F7F8FC;border-radius:12px;padding:20px 22px 22px;color:var(--ink)}
.form__grip{position:absolute;left:0;right:0;top:0;height:16px;display:flex;justify-content:center;align-items:center;cursor:ns-resize;touch-action:none;z-index:2}
.form__grip:before{content:"";width:36px;height:4px;border-radius:2px;background:#DADDE7;transition:background .2s,width .25s var(--ease)}
.form:hover .form__grip:before{background:#C3C8D6}
.form.resizing .form__grip:before{background:var(--blue);width:48px}
.form.resizing,.form.resizing *{cursor:ns-resize!important;-webkit-user-select:none;user-select:none}
.form__head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.form__title{font-size:16px;font-weight:700}
.form__more{position:relative}
.form__more>button{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:20px;color:#6f727e;margin-right:-8px}
.form__more>button:hover{background:#eceef4}
.menu{position:absolute;right:-8px;bottom:38px;background:#fff;border:1px solid var(--line-2);border-radius:12px;padding:6px;width:236px;opacity:0;visibility:hidden;transform:translateY(6px);transition:all .2s var(--ease);z-index:10}
.menu.open{opacity:1;visibility:visible;transform:none}
.menu button{display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 10px;border-radius:8px;font-size:13px;font-weight:600;text-align:left;color:var(--ink)}
.menu button svg{font-size:16px;color:var(--mute)}
.menu button:hover{background:#f2f3f8}
.menu button:disabled{opacity:.4;cursor:default;background:none}
.fld{position:relative;display:flex;align-items:center;gap:8px;width:100%;border-bottom:1px solid #C8CBD5;min-height:44px;margin-bottom:6px;text-align:left;transition:border-color .2s}
.fld:focus-within,.fp.open .fld{border-color:var(--blue)}
.fld input,.fld textarea{flex:1;min-width:0;width:100%;border:0;outline:0;background:none;font-size:14px;font-weight:600;color:var(--ink)}
.fld input{height:44px}
.fld textarea{resize:none;padding:12px 0;line-height:1.45;min-height:44px;display:block;overflow-y:auto}
.fld input::placeholder,.fld textarea::placeholder{color:#9a9da8;font-weight:500}
.fld>svg,.fld>span>svg{font-size:16px;color:#b0b3be}
.fld--btn{cursor:pointer;font-size:14px;font-weight:600}
.fld__v{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp.open .fld svg{color:var(--blue)}
.row2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
.fld.err{border-color:#E0485C}
.fld.err input{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.cats{display:flex;gap:6px;margin:14px 0 4px}
.cat{flex:1;height:32px;padding:0 10px;border-radius:1000px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#6f727e;background:#eceef4;transition:all .2s}
.cat:hover{background:#e3e6ef}
.cat.act{color:#fff}
.cat.act[data-c=work]{background:var(--c-work)}.cat.act[data-c=personal]{background:var(--c-personal)}.cat.act[data-c=study]{background:var(--c-study)}
.form__foot{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:18px}
.submit{height:40px;padding:0 22px;border-radius:8px;background:var(--blue);color:#fff;font-size:14px;font-weight:700;transition:transform .2s var(--ease),background .2s}
.submit:hover{background:var(--blue-2)}
.submit:active{transform:scale(.96)}
.ghostbtn{height:40px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:600;color:#6f727e;display:none;align-items:center;gap:6px;transition:background .2s,color .2s}
.ghostbtn svg{font-size:15px}
.ghostbtn:hover{background:#eceef4;color:var(--ink)}
.ghostbtn.danger:hover{color:#E0485C;background:#fdeef0}
.form.editing .ghostbtn{display:flex}

/* выпадашки даты и времени */
.fp{position:relative;min-width:0}
.dd{position:absolute;left:0;top:calc(100% + 4px);z-index:15;background:#fff;border:1px solid var(--line-2);border-radius:12px;padding:12px;
  opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .18s,transform .25s var(--ease),visibility .25s}
.fp.up .dd{top:auto;bottom:calc(100% + 4px);transform:translateY(4px)}
.fp.open .dd{opacity:1;visibility:visible;transform:none}
.dd-cal{width:280px}
.dd-time{left:auto;right:0;width:100%;min-width:132px;max-height:232px;overflow-y:auto;padding:6px;overscroll-behavior:contain}
.dc__head{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px 4px}
.dc__title{font-size:14px;font-weight:800}
.dc__nav{display:flex;gap:2px}
.dc__nav button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;color:var(--ink)}
.dc__nav button:hover{background:#f0f2f7}
.dc__grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;text-align:center}
.dc__wd{font-size:11px;font-weight:700;color:var(--mute);padding:4px 0 6px}
.dc__d{width:34px;height:34px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--ink);transition:background .15s,color .15s}
.dc__d:hover{background:#f0f2f7}
.dc__d.out{color:#c0c1c7}
.dc__d.today{background:var(--blue-soft);color:var(--blue);font-weight:800}
.dc__d.sel{background:var(--blue);color:#fff;font-weight:800}
.dc__q{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid #f0f0f3}
.dc__q button{flex:1;height:32px;border-radius:1000px;background:#f0f2f7;font-size:12px;font-weight:700;color:#3a3d44;transition:background .2s}
.dc__q button:hover{background:var(--blue-soft);color:var(--blue)}
.dt{display:block;width:100%;height:34px;padding:0 12px;border-radius:8px;text-align:left;font-size:13px;font-weight:600;color:var(--ink);transition:background .15s}
.dt:hover{background:#f0f2f7}
.dt.sel{background:var(--blue-soft);color:var(--blue);font-weight:800}

/* ползунки */
.tl::-webkit-scrollbar,.list::-webkit-scrollbar,.dd-time::-webkit-scrollbar,.sugg::-webkit-scrollbar,.fld textarea::-webkit-scrollbar{width:12px;height:12px}
.tl::-webkit-scrollbar-track,.list::-webkit-scrollbar-track,.dd-time::-webkit-scrollbar-track,.sugg::-webkit-scrollbar-track,.fld textarea::-webkit-scrollbar-track{background:transparent}
.tl::-webkit-scrollbar-thumb,.list::-webkit-scrollbar-thumb,.dd-time::-webkit-scrollbar-thumb,.sugg::-webkit-scrollbar-thumb,.fld textarea::-webkit-scrollbar-thumb{background:rgba(63,99,233,.28);border-radius:12px;border:4px solid transparent;background-clip:padding-box}
.tl::-webkit-scrollbar-thumb:hover,.list::-webkit-scrollbar-thumb:hover,.dd-time::-webkit-scrollbar-thumb:hover,.sugg::-webkit-scrollbar-thumb:hover{background-color:rgba(63,99,233,.5)}
.tl::-webkit-scrollbar-button,.list::-webkit-scrollbar-button,.dd-time::-webkit-scrollbar-button,.sugg::-webkit-scrollbar-button,.fld textarea::-webkit-scrollbar-button{display:none;width:0;height:0}
.tl::-webkit-scrollbar-corner{background:transparent}
@supports (-moz-appearance:none){.tl,.list,.dd-time,.sugg,.fld textarea{scrollbar-width:thin;scrollbar-color:rgba(63,99,233,.35) transparent}}

.toast{position:fixed;left:50%;bottom:24px;z-index:60;transform:translate(-50%,20px);opacity:0;background:#1d2030;color:#fff;border-radius:12px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:14px;font-size:13px;font-weight:600;transition:all .3s var(--ease);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{height:30px;padding:0 12px;border-radius:8px;background:var(--blue);color:#fff;font-weight:700;font-size:12px}

@media (max-width:1180px){
  .shell{grid-template-columns:minmax(0,1fr) 340px;gap:24px;padding:12px 12px 12px 24px;border-radius:36px}
  .who__txt{display:none}
}
.mbtn,.form__x{display:none}
.scrim{position:fixed;inset:0;z-index:39;background:rgba(14,22,60,.4);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.scrim.open{opacity:1;visibility:visible}
/* телефон: таймлайн на весь экран, поиск с календарём в шторке сверху, задача в шторке снизу */
@media (max-width:900px){
  .page{padding:8px}
  .shell{display:flex;flex-direction:column;height:calc(100vh - 16px);height:calc(100dvh - 16px);min-height:480px;max-height:none;padding:8px;gap:0;border-radius:28px}
  .left{flex:1;min-height:0;padding:0}
  .head{padding:4px 0 10px 4px;margin:0;gap:4px}
  .logo{display:none}
  .hicons{order:1;gap:2px}
  .head__sp{order:2}
  #calBtn{order:3}
  .who{order:4;margin-left:2px}
  #addBtn{order:5}
  .mbtn{display:grid}
  .who__ring{width:44px;height:44px}
  .who__ring svg{inset:2px;width:40px;height:40px}
  .who__ring span{font-size:11px}
  .addbtn{width:44px;height:44px;border-radius:12px;background:var(--blue);color:#fff;place-items:center;font-size:22px;margin-left:4px;transition:transform .2s var(--ease)}
  .addbtn:active{transform:scale(.94)}
  .hbtn.on{background:#fff;color:var(--ink)}
  .tl{border-radius:20px}
  .view{min-height:0}
  .side{position:fixed;top:8px;left:8px;right:8px;z-index:40;max-height:calc(100dvh - 16px);overflow-y:auto;border-radius:24px;
    opacity:0;visibility:hidden;transform:translateY(-12px);transition:opacity .25s,transform .35s var(--ease),visibility .35s}
  .side.open{opacity:1;visibility:visible;transform:none}
  .form-slot{display:none}
  .form.sheet{position:fixed;left:8px;right:8px;bottom:8px;top:auto;z-index:45;border-radius:24px;padding:22px 18px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(calc(100% + 24px));visibility:hidden;transition:transform .35s var(--ease),visibility .35s}
  .form.sheet.open{transform:none;visibility:visible}
  .form__x{display:grid;width:32px;height:32px;border-radius:8px;place-items:center;font-size:18px;color:#6f727e;margin-right:-8px}
  .form__x:hover{background:#eceef4}
  .form__more{margin-left:auto;margin-right:12px}
  .form__grip{display:none}
  :root{--colmin:150px;--hcol:44px;--hour:92px}
  .list{padding:0 4px}
}
@media (max-width:520px){
  .head{gap:8px}
  .cal{padding:18px 4px 6px}
  .cal__d{width:34px;height:34px}
  .form{padding:20px 16px}
  .fld input,.fld textarea,.search input{font-size:16px}
  :root{--colmin:136px}
  .task{padding:10px 8px 6px 11px}
}
@media (hover:none){.del{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bgw" aria-hidden="true"></div>
<div class="page">
  <div class="shell">
    <div class="left">
      <header class="head">
        <div class="logo"><i data-i="logo"></i><span><b>ToDo</b>Timeline</span></div>
        <div class="head__sp"></div>
        <div class="hicons">
          <button class="hbtn" data-view="week" title="Неделя" aria-label="Неделя" data-i="grid"></button>
          <button class="hbtn" data-view="list" title="Список" aria-label="Список" data-i="list"></button>
          <button class="hbtn" id="eyeBtn" title="Скрыть выполненные" aria-label="Скрыть выполненные"><i></i></button>
        </div>
        <div class="who"><span class="who__txt" id="whoTxt"></span><div class="who__ring" id="ring"></div></div>
        <button class="hbtn mbtn" id="calBtn" title="Поиск и календарь" aria-label="Поиск и календарь" data-i="cal"></button>
        <button class="mbtn addbtn" id="addBtn" title="Новая задача" aria-label="Новая задача" data-i="plus"></button>
      </header>
      <div class="view" id="view"></div>
    </div>

    <aside class="side">
      <div class="search" id="searchBox"><span data-i="search"></span><input id="q" type="text" inputmode="search" enterkeyhint="search" placeholder="Поиск" aria-label="Поиск по задачам" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="sugg"><button type="button" class="qx" id="qClear" aria-label="Очистить поиск" data-i="x"></button>
        <div class="sugg" id="sugg" role="listbox"></div>
      </div>
      <div class="cal" id="cal"></div>
      <div class="form-slot" id="formSlot">
      <form class="form" id="form" autocomplete="off" novalidate>
        <div class="form__grip" id="formGrip" title="Потяните, чтобы изменить высоту. Двойной клик вернёт авторазмер" aria-hidden="true"></div>
        <div class="form__head">
          <div class="form__title" id="formTitle">Новая задача</div>
          <button type="button" class="form__x" id="fClose" aria-label="Закрыть" data-i="x" style="order:3"></button>
          <div class="form__more"><button type="button" id="moreBtn" aria-label="Ещё" aria-haspopup="menu" data-i="dots"></button>
            <div class="menu" id="menu" role="menu">
              <button type="button" role="menuitem" id="clearDone"><span data-i="trash"></span>Удалить выполненные</button>
              <button type="button" role="menuitem" id="doneAll"><span data-i="checkAll"></span>Отметить все за неделю</button>
            </div>
          </div>
        </div>
        <div class="fld" id="fldTitle"><input id="fTitle" maxlength="120" placeholder="Название" aria-label="Название задачи"></div>
        <div class="fld"><textarea id="fDesc" rows="1" maxlength="500" placeholder="Описание" aria-label="Описание задачи"></textarea></div>
        <div class="row2">
          <div class="fp" id="fpDate">
            <button type="button" class="fld fld--btn" id="fDateBtn" aria-haspopup="dialog" aria-label="Дата"><span class="fld__v" id="fDateTxt"></span><span data-i="cal"></span></button>
            <div class="dd dd-cal" id="ddDate"></div>
          </div>
          <div class="fp" id="fpTime">
            <label class="fld"><input id="fTime" inputmode="numeric" maxlength="5" placeholder="00:00" aria-label="Время" autocomplete="off"><span data-i="clock"></span></label>
            <div class="dd dd-time" id="ddTime" role="listbox" aria-label="Время"></div>
          </div>
        </div>
        <div class="cats" id="fCats" role="group" aria-label="Категория"></div>
        <div class="form__foot">
          <button type="button" class="ghostbtn danger" id="fDelete"><span data-i="trash"></span>Удалить</button>
          <button type="button" class="ghostbtn" id="fCancel">Отмена</button>
          <button type="submit" class="submit" id="fSubmit">Добавить задачу</button>
        </div>
      </form>
      </div>
    </aside>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast"><span id="toastTxt"></span><button id="toastBtn">Вернуть</button></div>

<script>
(function(){
'use strict';
var S='fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"';
var ICONS={
  logo:'<path '+S+' stroke-width="2.4" d="M5 21v-6M12 21V9M19 21V3"/>',
  grid:'<g '+S+'><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></g>',
  list:'<path '+S+' d="M3 5h.01M3 12h.01M3 19h.01M8 5h13M8 12h13M8 19h13"/>',
  eye:'<g '+S+'><path d="M2.062 12.348a1 1 0 0 1 0-.696a10.75 10.75 0 0 1 19.876 0a1 1 0 0 1 0 .696a10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></g>',
  eyeOff:'<g '+S+'><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575a1 1 0 0 1 0 .696a10.8 10.8 0 0 1-1.444 2.49m-6.41-.679a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151a1 1 0 0 1 0-.696a10.75 10.75 0 0 1 4.446-5.143M2 2l20 20"/></g>',
  search:'<g '+S+'><path d="m21 21l-4.34-4.34"/><circle cx="11" cy="11" r="8"/></g>',
  x:'<path '+S+' d="M18 6L6 18M6 6l12 12"/>',
  left:'<path '+S+' d="m15 18l-6-6l6-6"/>',
  right:'<path '+S+' d="m9 18l6-6l-6-6"/>',
  down:'<path '+S+' d="m6 9l6 6l6-6"/>',
  check:'<path '+S+' stroke-width="2.4" d="M20 6L9 17l-5-5"/>',
  checkAll:'<path '+S+' d="M13 5h8m-8 7h8m-8 7h8M3 17l2 2l4-4M3 7l2 2l4-4"/>',
  trash:'<path '+S+' d="M10 11v6m4-6v6m5-11v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  cal:'<g '+S+'><path d="M8 2v3m8-3v3"/><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/></g>',
  clock:'<g '+S+'><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></g>',
  plus:'<path '+S+' d="M5 12h14m-7-7v14"/>',
  dots:'<g fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></g>'
};
function ic(n){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS[n]+'</svg>'}
document.querySelectorAll('[data-i]').forEach(function(el){el.insertAdjacentHTML('afterbegin',ic(el.dataset.i));el.removeAttribute('data-i')});

var CATS=[{id:'work',name:'Работа'},{id:'personal',name:'Личное'},{id:'study',name:'Учёба'}];
var CAT={};CATS.forEach(function(c){CAT[c.id]=c});
var MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var MONTHS_G=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var MON_SHORT=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
var WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
var WD_FULL=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];

function pad(n){return (n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){var r=new Date(d);r.setDate(r.getDate()+n);return r}
function wdi(d){return (d.getDay()+6)%7}
function weekStart(d){return addDays(new Date(d.getFullYear(),d.getMonth(),d.getDate()),-wdi(d))}
function todayD(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function mins(t){var p=t.split(':');return (+p[0])*60+(+p[1])}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fmtDate(s){var d=parse(s),y=d.getFullYear()!==todayD().getFullYear();return WD[wdi(d)]+', '+d.getDate()+' '+(y?MON_SHORT[d.getMonth()]+' '+d.getFullYear():MONTHS_G[d.getMonth()])}

var KEY='todo-timeline-v1',mem={};
function load(k,def){try{var v=localStorage.getItem(k);return v==null?def:JSON.parse(v)}catch(e){return k in mem?mem[k]:def}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}
var data=load(KEY,null);
if(!data||!Array.isArray(data.tasks)){data={tasks:seed()};store(KEY,data)}
var ui=load(KEY+'-ui',{});
var state={view:ui.view||'week',hideDone:!!ui.hideDone,sel:todayD(),month:todayD(),q:''};
function save(){store(KEY,data)}
function saveUi(){store(KEY+'-ui',{view:state.view,hideDone:state.hideDone})}

function seed(){
  var w=weekStart(todayD()),t=todayD(),list=[
    [0,'09:00','Разобрать почту и календарь','work','Ответить на срочное, остальное разнести по дням'],
    [0,'14:30','Еженедельная встреча команды','work','Статус по задачам и планы на неделю'],
    [1,'10:00','Созвон с подрядчиком','work','Обсудить сроки и смету'],
    [1,'15:00','Английский: урок 12','study','Past Perfect, упражнения 3–5'],
    [2,'11:00','Подготовить отчёт за неделю','work','Собрать цифры из таблицы и добавить выводы'],
    [2,'19:00','Купить продукты на неделю','personal','Овощи, крупы, кофе, молоко'],
    [3,'13:00','Прочитать главу книги','study',''],
    [3,'16:00','Оплатить интернет','personal','До конца месяца, через приложение банка'],
    [4,'12:00','Записаться к стоматологу','personal','Плановый осмотр, лучше на утро'],
    [4,'14:00','Ревью макетов','work','Главная и карточка товара'],
    [5,'11:00','Курс по аналитике, модуль 3','study','Посмотреть лекцию и сделать домашку']
  ];
  return list.map(function(r){var d=addDays(w,r[0]);return {id:uid()+r[0]+r[1].replace(':',''),title:r[2],desc:r[4],date:ymd(d),time:r[1],cat:r[3],done:d<t,created:Date.now()}});
}

var $=function(s){return document.querySelector(s)};
var view=$('#view');
function find(id){for(var i=0;i<data.tasks.length;i++)if(data.tasks[i].id===id)return data.tasks[i];return null}
function onDate(s){return data.tasks.filter(function(t){return t.date===s&&(!state.hideDone||!t.done)}).sort(function(a,b){return a.time<b.time?-1:a.time>b.time?1:0})}
function matches(t){if(!state.q)return true;return (t.title+' '+(t.desc||'')).toLowerCase().indexOf(state.q)>=0}
function H(){return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hour'))}

var lastAdded=null,prevKey='',editingId=null;

function layoutDay(list){
  var items=list.map(function(t){var s=mins(t.time);return {t:t,s:s,e:s+60}}),cur=null,clusters=[];
  items.forEach(function(it){
    if(!cur||it.s>=cur.end){cur={items:[],end:0,lanes:[]};clusters.push(cur)}
    var lane=0;while(cur.lanes[lane]!=null&&cur.lanes[lane]>it.s)lane++;
    cur.lanes[lane]=it.e;it.lane=lane;cur.items.push(it);cur.end=Math.max(cur.end,it.e);
  });
  clusters.forEach(function(c){c.items.forEach(function(it){it.n=c.lanes.length})});
  return items;
}

function renderWeek(){
  var w=weekStart(state.sel),t=ymd(todayD()),sel=ymd(state.sel),key='w'+ymd(w);
  var old=view.querySelector('.tl'),st=old?old.scrollTop:null,sl=old?old.scrollLeft:null,same=key===prevKey;
  var h='<div class="tl"><div class="tl__head"><button class="tl__corner" data-today title="К сегодняшнему дню" aria-label="К сегодняшнему дню">'+ic('down')+'</button>';
  for(var i=0;i<7;i++){var d=addDays(w,i),s=ymd(d);
    h+='<button class="tl__day'+(s===t?' today':'')+(s===sel?' sel':'')+'" data-pick="'+s+'">'+WD_FULL[i]+' <b>'+d.getDate()+'</b></button>'}
  h+='</div><div class="tl__body"><div class="tl__hours">';
  for(var k=1;k<24;k++)h+='<span style="top:calc(var(--hour)*'+k+')">'+k+'</span>';
  h+='</div>';
  for(i=0;i<7;i++){var dd=addDays(w,i),ss=ymd(dd);
    h+='<div class="tl__col'+(ss===sel?' sel':'')+'" data-col="'+ss+'"><div class="tl__lines"></div><div class="ghost"></div>';
    layoutDay(onDate(ss)).forEach(function(it){var tk=it.t,wd=100/it.n;
      h+='<div class="task '+tk.cat+(tk.done?' done':'')+(tk.id===lastAdded?' enter':'')+(matches(tk)?'':' dim')+(tk.id===editingId?' editing':'')+'" data-id="'+tk.id+'" role="button" tabindex="0" style="top:calc(var(--hour)*'+(it.s/60)+' + 5px);height:calc(var(--hour) - 10px);left:calc('+(wd*it.lane)+'% + 8px);width:calc('+wd+'% - 16px)">'+
        '<span class="bar"></span><div class="task__t"></div><div class="task__b"><span class="task__m">'+tk.time+'</span>'+
        '<button class="del" data-del="'+tk.id+'" aria-label="Удалить" title="Удалить">'+ic('trash')+'</button>'+
        '<button class="chk" data-chk="'+tk.id+'" aria-label="'+(tk.done?'Вернуть в работу':'Отметить выполненной')+'">'+ic('check')+'</button></div></div>'});
    if(ss===t){var n=new Date();h+='<div class="now" style="top:calc(var(--hour)*'+((n.getHours()*60+n.getMinutes())/60)+')"></div>'}
    h+='</div>';
  }
  h+='</div></div>';
  view.innerHTML=h;
  view.querySelectorAll('.task').forEach(function(el){var tk=find(el.dataset.id);el.querySelector('.task__t').textContent=tk.title;el.title=tk.desc?tk.title+'\n'+tk.desc:tk.title;el.setAttribute('aria-label',tk.title+', '+tk.time+(tk.done?', выполнено':'')+(tk.desc?'. '+tk.desc:''))});
  var tl=view.querySelector('.tl');
  if(same&&st!=null){tl.scrollTop=st;tl.scrollLeft=sl}
  else{
    if(prevKey)tl.classList.add('swap');
    var nh=new Date().getHours();tl.scrollTop=Math.max(0,(Math.min(Math.max(nh,9),17)-1.3)*H());

/* перетаскивание: мышью сразу, пальцем после удержания */
var drag=null,suppressClick=false;
view.addEventListener('pointerdown',function(e){
  if(e.button!==0||drag)return;
  var el=e.target.closest('.task');if(!el||e.target.closest('.chk,.del'))return;
  var r=el.getBoundingClientRect();
  drag={el:el,id:el.dataset.id,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,w:r.width,h:r.height,active:false,touch:e.pointerType!=='mouse',pid:e.pointerId,target:null};
  if(drag.touch)drag.timer=setTimeout(function(){if(drag&&!drag.active)startDrag()},300);
  document.addEventListener('pointermove',onDragMove,{passive:false});
  document.addEventListener('pointerup',onDragUp);
  document.addEventListener('pointercancel',onDragCancel);
});
document.addEventListener('touchmove',function(e){if(drag&&drag.active)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',function(e){if(drag)e.preventDefault()});
function onDragMove(e){
  if(!drag||e.pointerId!==drag.pid)return;
  drag.x=e.clientX;drag.y=e.clientY;var dist=Math.hypot(drag.x-drag.sx,drag.y-drag.sy);
  if(!drag.active){if(drag.touch){if(dist>8)endDrag(false)}else if(dist>5)startDrag();return}
  e.preventDefault();moveDrag();
}
function startDrag(){
  drag.active=true;
  var c=drag.el.cloneNode(true);c.classList.remove('enter','leave','editing','flash');c.classList.add('drag-clone');
  c.style.width=drag.w+'px';c.style.height=drag.h+'px';document.body.appendChild(c);drag.clone=c;
  drag.el.classList.add('drag-src');document.body.classList.add('dragging');
  if(drag.touch&&navigator.vibrate)try{navigator.vibrate(12)}catch(err){}
  moveDrag();autoScroll();
}
function clearDrop(){view.querySelectorAll('.dropghost').forEach(function(g){g.remove()});view.querySelectorAll('.drop').forEach(function(x){x.classList.remove('drop')})}
function moveDrag(){
  var x=drag.x,y=drag.y,t=find(drag.id);if(!t)return;
  drag.clone.style.transform='translate('+(x-drag.ox)+'px,'+(y-drag.oy)+'px) rotate(1.5deg)';
  var hit=document.elementFromPoint(x,y),day=hit&&hit.closest('.tl__day'),target=null;
  clearDrop();
  if(day){day.classList.add('drop');target={date:day.dataset.pick,time:t.time}}
  else{
    var tl=view.querySelector('.tl'),br=tl.getBoundingClientRect();
    if(y>=br.top-20&&y<=br.bottom+20&&x>=br.left-20&&x<=br.right+20){
      var cols=[].slice.call(view.querySelectorAll('.tl__col')),col=cols[0];
      cols.forEach(function(c){var r=c.getBoundingClientRect();if(x>=r.left)col=c});
      if(col){var hh=H(),cr=col.getBoundingClientRect();
        var m=Math.round(((y-drag.oy)-cr.top)/hh*60/15)*15;m=Math.max(0,Math.min(23*60+45,m));
        var tm=pad(Math.floor(m/60))+':'+pad(m%60);target={date:col.dataset.col,time:tm};
        var g=document.createElement('div');g.className='dropghost';g.style.top='calc(var(--hour)*'+(m/60)+' + 5px)';g.style.height='calc(var(--hour) - 10px)';g.textContent=tm;col.appendChild(g)}
    }
  }
  drag.target=target;
  var meta=drag.clone.querySelector('.task__m');if(meta&&target){var td=parse(target.date);meta.textContent=(target.date!==t.date?td.getDate()+' '+MON_SHORT[td.getMonth()]+', ':'')+target.time}
}
function autoScroll(){
  if(!drag||!drag.active)return;
  var sc=view.querySelector('.tl');
  if(sc){var r=sc.getBoundingClientRect(),e=48,dy=0,dx=0,hc=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hcol'));
    if(drag.y<r.top+56+e&&drag.y>r.top-60)dy=-Math.ceil((r.top+56+e-drag.y)/4);else if(drag.y>r.bottom-e&&drag.y<r.bottom+60)dy=Math.ceil((drag.y-(r.bottom-e))/4);
    if(drag.x<r.left+hc+e&&drag.x>r.left-40)dx=-Math.ceil((r.left+hc+e-drag.x)/4);else if(drag.x>r.right-e&&drag.x<r.right+40)dx=Math.ceil((drag.x-(r.right-e))/4);
    if(dy||dx){sc.scrollTop+=dy;sc.scrollLeft+=dx;moveDrag()}}
  drag.raf=requestAnimationFrame(autoScroll);
}
function onDragUp(e){if(!drag||e.pointerId!==drag.pid)return;endDrag(drag.active)}
function onDragCancel(e){if(!drag||e.pointerId!==drag.pid)return;endDrag(false)}
function endDrag(apply){
  var d=drag;drag=null;clearTimeout(d.timer);cancelAnimationFrame(d.raf);
  document.removeEventListener('pointermove',onDragMove);document.removeEventListener('pointerup',onDragUp);document.removeEventListener('pointercancel',onDragCancel);
  if(!d.active)return;
  suppressClick=true;setTimeout(function(){suppressClick=false},400);
  d.clone.remove();d.el.classList.remove('drag-src');document.body.classList.remove('dragging');clearDrop();
  var t=find(d.id),tg=d.target;
  if(apply&&t&&tg&&(tg.date!==t.date||tg.time!==t.time)){
    var was={date:t.date,time:t.time};t.date=tg.date;t.time=tg.time;lastAdded=t.id;save();
    if(editingId===t.id){setDate(t.date);setTime(t.time)}
    render();var dd=parse(tg.date);
    toast('Перенесено на '+dd.getDate()+' '+MONTHS_G[dd.getMonth()]+', '+tg.time,function(){t.date=was.date;t.time=was.time;lastAdded=t.id;save();if(editingId===t.id){setDate(t.date);setTime(t.time)}render()});
  }
}
document.addEventListener('click',function(e){if(suppressClick){suppressClick=false;e.stopPropagation();e.preventDefault()}},true);

document.addEventListener('click',function(e){
  var el,menu=$('#menu');
  if(!e.target.closest('.form__more'))menu.classList.remove('open');
  if(!e.composedPath().some(function(n){return n.classList&&n.classList.contains('search')}))closeSugg();
  if(el=e.target.closest('[data-chk]')){e.stopPropagation();toggle(el.dataset.chk);return}
  if(el=e.target.closest('[data-del]')){e.stopPropagation();remove(el.dataset.del);return}
  if(el=e.target.closest('[data-c]')){fCat=el.dataset.c;renderCats();return}
  if(el=e.target.closest('[data-view]')){state.view=el.dataset.view;prevKey='';saveUi();render();return}
  if(el=e.target.closest('[data-today]')){state.month=todayD();if(isMob())closeSide();pick(ymd(todayD()),true);return}
  if(el=e.target.closest('[data-pick]')){var inCal=!!el.closest('.cal');if(inCal&&isMob())closeSide();pick(el.dataset.pick,inCal);return}
  if(el=e.target.closest('[data-month]')){var m=state.month;state.month=new Date(m.getFullYear(),m.getMonth()+(+el.dataset.month),1);renderCal();return}
  if(el=e.target.closest('.task,.lrow')){editTask(el.dataset.id);return}
  if(el=e.target.closest('.tl__col')){
    var r=el.getBoundingClientRect(),hh=H(),m2=Math.max(0,Math.min(23*60,Math.floor((e.clientY-r.top)/hh*2)*30));
    resetForm();state.sel=parse(el.dataset.col);setDate(el.dataset.col);setTime(pad(Math.floor(m2/60))+':'+pad(m2%60));
    view.querySelectorAll('.tl__col').forEach(function(c){c.classList.toggle('sel',c===el)});
    view.querySelectorAll('.tl__day').forEach(function(c){c.classList.toggle('sel',c.dataset.pick===el.dataset.col)});
    view.querySelectorAll('.ghost').forEach(function(g){g.style.display='none'});
    var g=el.querySelector('.ghost');g.style.top='calc(var(--hour)*'+(m2/60)+' + 5px)';g.style.height='calc(var(--hour) - 10px)';g.style.display='block';
    renderCal();
    if(isMob()){openSheet();growDesc()}
    setTimeout(function(){fTitle.focus({preventScroll:true})},innerWidth<=900?350:0);
    return}
});
$('#moreBtn').addEventListener('click',function(){var dn=data.tasks.some(function(t){return t.done});$('#clearDone').disabled=!dn;$('#menu').classList.toggle('open')});
$('#clearDone').addEventListener('click',function(){var before=data.tasks.slice(),n=data.tasks.filter(function(t){return t.done}).length;if(!n)return;
  data.tasks=data.tasks.filter(function(t){return !t.done});if(editingId&&!find(editingId))resetForm();save();render();$('#menu').classList.remove('open');
  toast('Удалено выполненных: '+n,function(){data.tasks=before;save();render()})});
$('#doneAll').addEventListener('click',function(){var w=weekStart(state.sel),a=ymd(w),b=ymd(addDays(w,6)),ch=[];
  data.tasks.forEach(function(t){if(!t.done&&t.date>=a&&t.date<=b){t.done=true;ch.push(t)}});$('#menu').classList.remove('open');
  if(!ch.length){toast('На этой неделе всё уже сделано');return}save();render();toast('Отмечено задач: '+ch.length,function(){ch.forEach(function(t){t.done=false});save();render()})});
$('#eyeBtn').addEventListener('click',function(){state.hideDone=!state.hideDone;saveUi();render()});

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(drag){endDrag(false);return}$('#menu').classList.remove('open');if(form.querySelector('.fp.open')){closeDd();return}
    if(form.classList.contains('open')){closeSheet(true);return}if(sidePanel.classList.contains('open')){closeSide();return}if(editingId)resetForm()}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.task,.lrow')){e.preventDefault();editTask(e.target.dataset.id)}
});
addEventListener('storage',function(e){if(e.key===KEY){data=load(KEY,data);render()}});
var renderedDay=ymd(todayD());
setInterval(function(){if(drag)return;if(state.view==='week'){var n=view.querySelector('.now');if(n){var d=new Date();n.style.top='calc(var(--hour)*'+((d.getHours()*60+d.getMinutes())/60)+')'}}if(ymd(todayD())!==renderedDay){renderedDay=ymd(todayD());render()}},60000);

render();resetForm();placeForm();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){setSlot();growDesc()});
})();
</script>
</body>
</html>
